[package]
name = "stelligra-wasm"
version = "0.1.0"
authors = ["Nicholas Paustian <npaustian@slv.vic.gov.au>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
